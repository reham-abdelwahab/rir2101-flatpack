<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FlatPack Regressions</title>
<style>
  body { font: 14px/1.4 system-ui, sans-serif; margin: 16px; background: #fff; color: #111; }
  iframe { width: 1280px; height: 900px; border: 1px solid #ccc; }
  .frames { display: none; }
  .ok { color: #166534; } .bad { color: #b91c1c; font-weight: bold; }
  pre { white-space: pre-wrap; }
</style>
</head>
<body>
<h1>FlatPack regressions</h1>
<p>Compares the candidate build against a baseline build (the last verified master).
Usage: <code>tests/regress.html?cand=../index.html&amp;base=../_baseline.html</code>.
Without a baseline only the self-checks run. Results are also on <code>window.REGRESS</code>.</p>
<pre id="out">running…</pre>
<div class="frames"><iframe id="fc"></iframe><iframe id="fb"></iframe></div>
<script>
const qs = new URLSearchParams(location.search);
const CAND = qs.get('cand') || '../index.html';
const BASE = qs.get('base');
const out = document.getElementById('out');
const results = [];
const log = (ok, name, detail = '') => { results.push({ ok, name, detail }); render(); };
function render() {
  out.innerHTML = results.map(r => `<span class="${r.ok ? 'ok' : 'bad'}">${r.ok ? 'PASS' : 'FAIL'}</span> ${r.name}${r.detail ? ' — ' + r.detail : ''}`).join('\n');
}
const sleep = ms => new Promise(r => setTimeout(r, ms));

function load(frame, src) {
  return new Promise(res => {
    frame.onload = async () => {
      const w = frame.contentWindow;
      w.__errors = [];
      w.addEventListener('error', e => w.__errors.push(String(e.message)));
      const ce = w.console.error.bind(w.console);
      w.console.error = (...a) => { w.__errors.push(a.join(' ')); ce(...a); };
      await sleep(600);
      w.__S = w.eval('({ state, imgState, v: typeof TOOL_VERSION === "undefined" ? undefined : TOOL_VERSION })');
      if (w.__S.state && w.__S.state.stampReady) await w.__S.state.stampReady;
      res(w);
    };
    frame.src = src;
  });
}

// Lines the candidate adds on purpose (version credit, verification stamp) are removed before comparing.
const normalize = s => s
  .replace(/<text[^>]*>Studio Flat-Pack Maker v[^<]*<\/text>/g, '')
  .replace(/<text[^>]*class="verify-line"[^>]*>.*?<\/text>/g, '')
  .replace(/\s+/g, ' ');

const ARCH = ['chair', 'sofa', 'table', 'bed', 'cabinet', 'shelf'];
const SCALES = [10, 15, 20, 25, 30, 50];
const SHEETS = ['A4', 'A3'];

async function settle(w) { if (w.__S.state && w.__S.state.stampReady) await w.__S.state.stampReady; }

async function sweep(w) {
  const rows = [];
  for (const a of ARCH) for (const sc of SCALES) for (const sh of SHEETS) {
    w.selectArchetype(a); w.setSheetSize(sh); w.setScale(sc);
    await settle(w);
    rows.push({ key: `${a} 1:${sc} ${sh}`, fits: w.__S.state.fitsOnPage, svg: w.document.getElementById('a4-cut-svg').innerHTML });
  }
  return rows;
}

function chairImage() {
  // 350 x 850 px side-profile chair silhouette (1 px = 1 mm real at 1:1) on a light background.
  const c = document.createElement('canvas'); c.width = 500; c.height = 1000;
  const x = c.getContext('2d');
  x.fillStyle = '#f2f2f2'; x.fillRect(0, 0, 500, 1000);
  x.fillStyle = '#222';
  x.fillRect(75, 75, 40, 850);     // back post (full height 850)
  x.fillRect(75, 455, 350, 40);    // seat (width 350)
  x.fillRect(385, 495, 40, 430);   // front leg
  return c.toDataURL('image/png');
}

async function trace(w) {
  w.document.getElementById('inp-student-name').value = ''; w.document.getElementById('inp-student-id').value = ''; w.updateStudentMeta(); await settle(w);
  w.switchMainTab('image');
  w.imgLoadSrc(chairImage());
  for (let i = 0; i < 50 && !w.__S.imgState.loaded; i++) await sleep(100);
  w.__S.imgState.calib.p1 = [75, 950]; w.__S.imgState.calib.p2 = [425, 950]; w.__S.imgState.calib.cm = 35;
  w.imgSetScale(10);
  w.imgAutoTrace();
  await sleep(300); await settle(w);
  w.renderImageSheet(); await settle(w);
  const ext = w.__S.imgState.extents;
  const cut = w.__S.imgState.shapes.filter(s => s.kind === 'cut');
  const xs = cut.flatMap(s => s.pts.map(p => p[0])), ys = cut.flatMap(s => s.pts.map(p => p[1]));
  const mmPerPx = w.imgMmPerPx();
  const size = xs.length ? [(Math.max(...xs) - Math.min(...xs)) * mmPerPx, (Math.max(...ys) - Math.min(...ys)) * mmPerPx] : [0, 0];
  const svg = w.document.getElementById('image-cut-svg').innerHTML;
  w.switchMainTab('tool');
  return { size, shapes: JSON.stringify(w.__S.imgState.shapes), svg, ext };
}

async function helpRoundTrip(w) {
  w.selectArchetype('table'); w.setSheetSize('A3'); w.setScale(15);
  w.document.getElementById('inp-student-name').value = 'Test Student';
  w.document.getElementById('inp-student-id').value = '12345';
  w.updateStudentMeta(); await settle(w);
  const keys = ['archetype', 'w', 'd', 'h', 'subH', 'scale', 'sheetSize', 'thicknessMm', 'joinery', 'studentName', 'studentId', 'projectRoom'];
  const before = JSON.stringify(keys.map(k => w.__S.state[k])) + JSON.stringify(w.__S.state.curveOffsets);
  const stampBefore = w.__S.state.stamp;
  let copied = '';
  const orig = w.document.execCommand.bind(w.document);
  w.document.execCommand = (cmd) => { if (cmd === 'copy') copied = [...w.document.querySelectorAll('body > textarea')].pop()?.value || ''; return true; };
  w.copyStudentDiagnosticCode();
  w.document.execCommand = orig;
  // scramble, then restore from the code
  w.selectArchetype('chair'); w.setSheetSize('A4'); w.setScale(20);
  w.document.getElementById('inp-student-name').value = ''; w.document.getElementById('inp-student-id').value = '';
  w.updateStudentMeta(); await settle(w);
  w.document.getElementById('inp-restore-code').value = copied;
  w.loadStudentDiagnosticCode(); await settle(w);
  const after = JSON.stringify(keys.map(k => w.__S.state[k])) + JSON.stringify(w.__S.state.curveOffsets);
  return { ok: before === after, before, after, copied, stampBefore, stampAfter: w.__S.state.stamp };
}

function overlapCheck(w, svgId) {
  // Text in the title block must not overlap: check every pair of <text> boxes in the bottom 26 mm.
  const svg = w.document.getElementById(svgId);
  const vb = svg.viewBox.baseVal; const tb = vb.height - 26;
  const texts = [...svg.querySelectorAll('text')].filter(t => { try { return t.getBBox().y >= tb; } catch { return false; } });
  const boxes = texts.map(t => ({ t: t.textContent.slice(0, 40), b: t.getBBox() }));
  const bad = [];
  for (let i = 0; i < boxes.length; i++) for (let j = i + 1; j < boxes.length; j++) {
    const a = boxes[i].b, b = boxes[j].b;
    if (a.x < b.x + b.width - 0.2 && b.x < a.x + a.width - 0.2 && a.y < b.y + b.height - 0.2 && b.y < a.y + a.height - 0.2) bad.push(`${boxes[i].t} ⟷ ${boxes[j].t}`);
  }
  const outside = boxes.filter(o => o.b.x < 6 || o.b.x + o.b.width > vb.width - 6).map(o => o.t);
  return { bad, outside };
}

(async () => {
  const wc = await load(document.getElementById('fc'), CAND);
  const wb = BASE ? await load(document.getElementById('fb'), BASE) : null;

  log(wc.__errors.length === 0, 'Candidate loads without console errors', wc.__errors.join(' | '));
  log(typeof wc.__S.v === 'string', 'TOOL_VERSION constant present', String(wc.__S.v));
  const pill = wc.document.getElementById('header-version-pill');
  log(!!pill && pill.textContent === 'v' + wc.__S.v, 'Header shows version pill', pill ? pill.textContent : 'missing');

  // Fully offline: nothing loaded from the network, every icon class in use has an inline mask
  const ext = [...wc.document.querySelectorAll('link[href], script[src], img[src^="http"], iframe[src]')].map(e => e.href || e.src);
  const netRes = wc.performance.getEntriesByType('resource').map(r => r.name).filter(u => !u.startsWith(wc.location.origin) && !u.startsWith('data:') && !u.startsWith('blob:'));
  log(ext.length === 0 && netRes.length === 0, 'Fully offline: no external links or network requests', [...ext, ...netRes].join(', '));
  const iconCls = new Set();
  wc.document.documentElement.outerHTML.replace(/fa-(?!solid\b|regular\b)[a-z0-9-]+/g, m => iconCls.add(m));
  for (const s of wc.document.querySelectorAll('script')) (s.textContent.match(/fa-(?!solid\b|regular\b)[a-z0-9-]+/g) || []).forEach(m => iconCls.add(m));
  const noMask = [...iconCls].filter(c => {
    const i = wc.document.createElement('i'); i.className = (c === 'fa-image' ? 'fa-regular ' : 'fa-solid ') + c; wc.document.body.appendChild(i);
    const cs = wc.getComputedStyle(i); const m = cs.webkitMaskImage || cs.maskImage; const ok = m && m.startsWith('url("data:image/svg+xml');
    i.remove(); return !ok;
  });
  if (/embedded-icons/.test(wc.document.head.innerHTML)) log(noMask.length === 0, `Every icon in use has an inline mask (${iconCls.size} icons)`, noMask.join(', '));

  const sc = await sweep(wc);
  const sb = wb ? await sweep(wb) : null;
  const vText = sc.every(r => r.svg.includes('Studio Flat-Pack Maker v' + wc.__S.v));
  log(vText, 'Version printed in Tab 1 title block (all 72 combinations)');
  if (sb) {
    const diffs = sc.filter((r, i) => normalize(r.svg) !== normalize(sb[i].svg) || r.fits !== sb[i].fits).map(r => r.key);
    log(diffs.length === 0, '72-combination sweep identical to baseline (geometry, fit flags, labels)', diffs.slice(0, 6).join(', '));
  }
  log(sc.filter(r => !r.fits).length === (sb ? sb.filter(r => !r.fits).length : sc.filter(r => !r.fits).length), 'Overflow reported, never shrunk', `${sc.filter(r => !r.fits).length} of 72 combinations report "does not fit"`);

  for (const [a, s, sh] of [['chair', 20, 'A4'], ['bed', 25, 'A3'], ['shelf', 10, 'A4']]) {
    wc.selectArchetype(a); wc.setSheetSize(sh); wc.setScale(s);
    wc.document.getElementById('inp-student-name').value = 'Abdelrahman Mohamed Abdelwahab'; wc.document.getElementById('inp-student-id').value = '231012345';
    wc.updateStudentMeta(); await settle(wc);
    const o = overlapCheck(wc, 'a4-cut-svg');
    log(o.bad.length === 0 && o.outside.length === 0, `Tab 1 title block: no overlapping / clipped text (${a} 1:${s} ${sh})`, [...o.bad, ...o.outside].join('; '));
  }

  const tc = await trace(wc);
  log(Math.abs(tc.size[0] - 35) < 0.6 && Math.abs(tc.size[1] - 85) < 0.6, 'Image tab traces 35×85 cm chair to ≈35×85 mm at 1:10', tc.size.map(v => v.toFixed(1)).join(' × ') + ' mm');
  log(tc.svg.includes('Studio Flat-Pack Maker v' + wc.__S.v), 'Version printed in Tab 3 title block');
  {
    wc.switchMainTab('image'); await sleep(100);
    const o = overlapCheck(wc, 'image-cut-svg');
    log(o.bad.length === 0 && o.outside.length === 0, 'Tab 3 title block: no overlapping / clipped text', [...o.bad, ...o.outside].join('; '));
    wc.switchMainTab('tool');
  }
  if (wb) {
    const tb = await trace(wb);
    log(tc.shapes === tb.shapes, 'Image-tab trace identical to baseline (shape points)');
    log(normalize(tc.svg) === normalize(tb.svg), 'Image-tab sheet identical to baseline (apart from added lines)');
  }

  const h = await helpRoundTrip(wc);
  log(h.ok, 'Help Code round-trips state exactly', h.ok ? '' : `${h.before} → ${h.after}`);
  if ('stamp' in wc.__S.state) {
    log(/^[A-Z2-7]{4}-[A-Z2-7]{4}$/.test(h.stampBefore || ''), 'Stamp format XXXX-XXXX', h.stampBefore);
    log(h.stampBefore === h.stampAfter, 'Stamp identical after Help Code restore', `${h.stampBefore} → ${h.stampAfter}`);
    log(h.copied.includes(h.stampBefore), 'Help Code message contains the stamp');

    // SHA-256 must match Web Crypto (block boundaries, Arabic, empty)
    const samples = ['', 'abc', 'a'.repeat(55), 'a'.repeat(56), 'a'.repeat(64), 'مريم عماد|231012345', 'x'.repeat(200)];
    const hex = u8 => [...u8].map(b => b.toString(16).padStart(2, '0')).join('');
    let shaOk = true;
    for (const s of samples) {
      const ref = hex(new Uint8Array(await crypto.subtle.digest('SHA-256', new TextEncoder().encode(s))));
      if (hex(wc.sha256Bytes(s)) !== ref) shaOk = false;
    }
    log(shaOk, 'Built-in SHA-256 matches crypto.subtle (7 samples)');

    const svgNow = wc.document.getElementById('a4-cut-svg').textContent;
    log(svgNow.includes(`VERIFY: ${wc.__S.state.stamp} · v${wc.__S.v}`), 'Tab 1 title block prints "VERIFY: XXXX-XXXX · vX.Y"');
    log(/03_LABELS_BLACK/.test(wc.document.getElementById('a4-cut-svg').innerHTML.split('verify-line')[0]), 'Stamp sits in the 03_LABELS_BLACK layer');

    // Every hashed field changes the stamp
    const base = wc.sheetStampFields();
    const s0 = wc.computeStamp(base);
    const tweaks = { name: 'Other', id: '999', archetype: 'sofa', w: base.w + 1, d: base.d + 1, h: base.h + 1, subH: base.subH + 1, scale: base.scale + 5, sheet: base.sheet === 'A4' ? 'A3' : 'A4', thickness: base.thickness + 0.5, joinery: base.joinery === 'fold' ? 'slot' : 'fold', version: '9.9' };
    const insensitive = Object.entries(tweaks).filter(([k, v]) => wc.computeStamp({ ...base, [k]: v }) === s0).map(([k]) => k);
    log(insensitive.length === 0, 'Changing any hashed value changes the stamp', insensitive.join(', '));
    log(wc.computeStamp({ ...base, name: '  ' + String(base.name).toUpperCase() + ' ', id: ' ' + base.id + ' ', version: 'v' + base.version }) === s0, 'Stamp tolerant of case / spaces / "v" prefix when re-typed');

    // Verify box: fill from Help Code → match; edit scale → no match
    wc.openShareSupportModal();
    wc.document.getElementById('vf-help').value = h.copied;
    wc.verifyFillFromHelp();
    log(wc.verifySheet() === true, 'Verify box: Help Code fill + printed stamp → ✔', wc.document.getElementById('vf-result').textContent);
    wc.document.getElementById('vf-scale').value = '10';
    log(wc.verifySheet() === false, 'Verify box: edited scale → ✘', wc.document.getElementById('vf-result').textContent);
    // manual entry from paper for Tab 3 sheet
    const im = wc.__S.imgState;
    wc.document.getElementById('vf-type').value = 'image'; wc.verifyTypeUI();
    wc.document.getElementById('vf-name').value = wc.__S.state.studentName; wc.document.getElementById('vf-id').value = wc.__S.state.studentId;
    wc.document.getElementById('vf-pieces').value = im.pieceSizes; wc.document.getElementById('vf-scale').value = im.scale;
    wc.document.getElementById('vf-sheet').value = im.sheet; wc.document.getElementById('vf-ver').value = 'v' + wc.__S.v;
    wc.document.getElementById('vf-stamp').value = im.stamp.toLowerCase();
    log(wc.verifySheet() === true, 'Verify box: Tab 3 image sheet typed from paper → ✔', `${im.pieceSizes} → ${im.stamp}`);
    log(wc.document.getElementById('image-cut-svg').textContent.includes(`VERIFY: ${im.stamp} · v${wc.__S.v}`), 'Tab 3 title block prints the stamp');
    wc.closeShareSupportModal();
  }

  // ---------------- v4 · C1 waffle (port of docs/waffle_reference.py) ----------------
  if (typeof wc.waffle === 'function') {
    const ref = wc.waffleReferenceChair();
    const rv = wc.waffleValidate(ref);
    log(ref.xs.length === 7 && ref.ys.length === 8 && ref.crossings.size === 56, 'Waffle reference chair: 7 X-ribs + 8 Y-ribs, 56 crossings (as waffle.py)', `${ref.xs.length} + ${ref.ys.length}, ${ref.crossings.size}`);
    log(rv.errors.length === 0, 'Waffle reference chair: 0 validation errors', rv.errors.slice(0, 3).join('; '));
    // rib areas against the shapely output (tests/fixtures/chair_waffle_sheet.svg, coordinates rounded to 0.01 mm)
    try {
      const svg = await (await fetch('fixtures/chair_waffle_sheet.svg')).text();
      const doc = new DOMParser().parseFromString(svg, 'image/svg+xml');
      const refAreas = [...doc.querySelectorAll('[id="01_CUT_RED"] path')].map(p => {
        const rings = p.getAttribute('d').split('Z').map(s => s.trim()).filter(Boolean).map(s => s.replace('M', '').split('L').map(q => q.trim().split(',').map(Number)));
        return wc.wfArea(wc.polygonClipping.xor(...rings.map(r => [[r]])));
      });
      const diffs = ref.ribs.map((r, i) => Math.abs(wc.wfArea(r.poly) - refAreas[i]));
      log(refAreas.length === 15 && Math.max(...diffs) < 0.25, 'Waffle rib areas match shapely reference (all 15 ribs, ≤ 0.25 mm²)', `max diff ${Math.max(...diffs).toFixed(3)} mm²`);
    } catch (e) { log(false, 'Waffle reference fixture readable', String(e)); }
    // every archetype validates at 1:10 and 1:20 on 1.5 mm board
    const bad = [];
    for (const a of ['chair', 'sofa', 'bed', 'table', 'cabinet']) for (const sc of [10, 20]) {
      const p = { archetype: a, ...wc.eval('archetypes')[a] };
      const s = wc.waffleSilhouettes(p, 10 / sc, 1.5);
      const v = wc.waffleValidate(wc.waffle(s.side, s.front, s.W, s.D, 1.5, 10, 0));
      if (!v.ok) bad.push(`${a} 1:${sc}: ${v.errors[0]}`);
    }
    log(bad.length === 0, 'Waffle: all 5 archetypes validate at 1:10 and 1:20 (1.5 mm)', bad.join('; '));
    // hand-cut kerf widens every slot to t + 0.2
    const s10 = wc.waffleSilhouettes({ archetype: 'table', ...wc.eval('archetypes').table }, 1, 1.5, 0.2);
    const hk = wc.waffle(s10.side, s10.front, s10.W, s10.D, 1.5, 10, 0.2), hv = wc.waffleValidate(hk);
    log(hv.ok && Math.abs(hk.slotWidth - 1.7) < 1e-9, 'Waffle: hand-cut kerf → measured slot width 1.7 mm everywhere', `${hv.checked} joints, ${hv.errors.length} errors`);
    // the validator must catch broken geometry
    const s0 = wc.waffleSilhouettes({ archetype: 'chair', ...wc.eval('archetypes').chair }, 1, 1.5);
    const noSlots = wc.waffle(s0.side, s0.front, s0.W, s0.D, 1.5, 10, 0); noSlots.ribs[0].poly = s0.side;
    log(wc.waffleValidate(noSlots).errors.some(e => /top slot missing/.test(e)), 'Waffle validator catches a rib without slots');
    const tight = wc.waffle(s0.side, s0.front, s0.W, s0.D, 3, 6, 0);
    log(wc.waffleValidate(tight).errors.some(e => /web between slots/.test(e)), 'Waffle validator catches webs thinner than 2t');
  }

  // ---------------- v4 · C2 nesting ----------------
  if (typeof wc.nestAll === 'function') {
    const A = wc.eval('archetypes');
    const mk = (a, qty, method = 'fold', o = {}) => ({ archetype: a, w: A[a].w, d: A[a].d, h: A[a].h, subH: A[a].subH, qty, method, curveOffsets: [0, 0, 0, 0, 0], ...o });
    const cfg = { scale: 20, sheetSize: 'A4', thicknessMm: 0.5, name: 'Test Student', id: '231045', course: 'RIR2101' };
    const e2 = wc.nestAll([mk('bed', 1), mk('cabinet', 2, 'fold', { w: 45, d: 40, h: 50, subH: 10 }), mk('cabinet', 1, 'fold', { w: 100, d: 60, h: 200, subH: 10 })], cfg);
    log(e2.total <= 2 && e2.oversize.length === 0, 'E2: bed + 2 bedside tables + wardrobe at 1:20 nest on ≤ 2 A4 sheets', `${e2.total} sheets, ${e2.oversize.length} oversize`);
    const wf = wc.nestAll([mk('chair', 1, 'waffle'), mk('sofa', 2, 'fold')], { ...cfg, scale: 10, thicknessMm: 1.5, sheetSize: 'A3' });
    // geometry checks on the rendered sheets: inside the printable area, no overlaps, never scaled
    const host = document.createElement('div'); host.style.cssText = 'position:absolute;left:-99999px;width:800px'; document.body.appendChild(host);
    const probs = [];
    for (const [label, res, size] of [['E2', e2, 'A4'], ['mixed', wf, 'A3']]) {
      for (const sh of res.sheets) {
        host.innerHTML = sh.svg; const svg = host.firstElementChild;
        const [SW, SH] = size === 'A3' ? [297, 420] : [210, 297];
        if (/scale\(/.test(svg.querySelector('[id="01_CUT_RED"]').innerHTML)) probs.push(`${label} sheet ${sh.idx}: a part is scaled`);
        const boxes = [...svg.querySelectorAll('[id="01_CUT_RED"] > g')].map(g => { const b = g.getBBox(), m = g.getCTM(), r = svg.getCTM().inverse().multiply(m);
          const pts = [[b.x, b.y], [b.x + b.width, b.y], [b.x, b.y + b.height], [b.x + b.width, b.y + b.height]].map(([x, y]) => [r.a * x + r.c * y + r.e, r.b * x + r.d * y + r.f]);
          return { x0: Math.min(...pts.map(p => p[0])), y0: Math.min(...pts.map(p => p[1])), x1: Math.max(...pts.map(p => p[0])), y1: Math.max(...pts.map(p => p[1])) }; });
        boxes.forEach((b, i) => {
          if (b.x0 < 7.9 || b.x1 > SW - 7.9 || b.y0 < 30.9 || b.y1 > SH - 26.9) probs.push(`${label} sheet ${sh.idx}: part ${i + 1} outside the printable area`);
          boxes.slice(i + 1).forEach((c, j) => { if (b.x0 < c.x1 - 0.5 && c.x0 < b.x1 - 0.5 && b.y0 < c.y1 - 0.5 && c.y0 < b.y1 - 0.5) probs.push(`${label} sheet ${sh.idx}: parts ${i + 1} and ${i + j + 2} overlap`); });
        });
        const txt = svg.textContent;
        if (!/5 cm CHECK RULER/.test(txt) || !/PARTS ON THIS SHEET/.test(txt) || !txt.includes(`VERIFY: ${sh.stamp}`) || !txt.includes(`SHEET ${sh.idx} / ${res.total}`)) probs.push(`${label} sheet ${sh.idx}: ruler / parts list / stamp / page number missing`);
      }
    }
    host.remove();
    log(probs.length === 0, 'Nested sheets: parts inside printable area, no overlaps, never scaled; ruler + parts list + stamp + "Sheet n / N" on every sheet', probs.slice(0, 4).join('; '));
    const stamps = [...e2.sheets, ...wf.sheets].map(s => s.stamp);
    log(new Set(stamps).size === stamps.length, 'Every nested sheet has its own stamp', stamps.join(' '));
    // true scale is kept: the nested mattress top equals the single-sheet geometry
    const bedTop = e2.parts.find(p => /MATTRESS TOP/.test(p.name));
    log(bedTop && Math.abs(bedTop.w - (160 * 10 / 20 + 2 * 38 * 10 / 20)) < 0.01, 'Nested parts keep true scale (bed net width = W + 2 × base height)', bedTop ? bedTop.w.toFixed(2) + ' mm' : 'missing');

    // ---------------- v4 · C3 line weights ----------------
    const s1 = e2.sheets[0].svg;
    log(/id="01_CUT_RED"[^>]*stroke-width="0\.2"/.test(s1) && /id="02_SCORE_BLUE"[^>]*stroke-width="0\.15"/.test(s1), 'Printed sheets: cut 0.2 mm, score 0.15 mm');
    // rasterise a 4 × 4 mm window of a horizontal cut edge at 600 dpi and measure the line
    const px = 600 / 25.4;
    host.innerHTML = s1; document.body.appendChild(host); const svgEl = host.firstElementChild;
    const g0 = svgEl.querySelector('[id="01_CUT_RED"] > g'); const bb = g0.getBBox(); const m0 = g0.getCTM(), rr = svgEl.getCTM().inverse().multiply(m0);
    const cx = rr.a * (bb.x + bb.width / 2) + rr.e, top = rr.d * bb.y + rr.f;
    host.remove();
    const win = s1.replace(/viewBox="[^"]*" width="[^"]*" height="[^"]*"/, `viewBox="${cx - 2} ${top - 2} 4 4" width="${4 * px}" height="${4 * px}"`);
    const img = new Image(); img.src = URL.createObjectURL(new Blob([win], { type: 'image/svg+xml' })); await img.decode();
    const cv = document.createElement('canvas'); cv.width = cv.height = Math.round(4 * px); const ctx = cv.getContext('2d'); ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, cv.width, cv.height); ctx.drawImage(img, 0, 0, cv.width, cv.height);
    const col = ctx.getImageData(Math.round(2 * px), 0, 1, cv.height).data; let cov = 0;
    for (let i = 0; i < col.length; i += 4) cov += Math.max(0, (255 - col[i + 1]) / (255 - 38));
    const mm = cov / px;
    log(mm > 0.1 && mm <= 0.25, 'Cut line rasterised at 600 dpi measures ≤ 0.25 mm', `${mm.toFixed(3)} mm (${cov.toFixed(1)} px)`);
    // print CSS for the single-piece sheets, and the laser hairline
    const rules = [...wc.document.getElementById('v4-print-lines').sheet.cssRules].filter(r => r.media && r.media.mediaText === 'print').flatMap(r => [...r.cssRules]).map(r => r.cssText).join(' ');
    log(/01_CUT_RED[^}]*stroke-width: 0\.2px/.test(rules) && /02_SCORE_BLUE[^}]*stroke-width: 0\.15px/.test(rules) && /00_BACKGROUND_GRID[^}]*display: none/.test(rules), 'Print CSS: cut 0.2 mm, score 0.15 mm, grid hidden');
    const lz = wc.document.createElement('div'); lz.innerHTML = s1; wc.laserStrokes(lz.firstElementChild);
    log(lz.querySelector('[id="01_CUT_RED"]').getAttribute('stroke-width') === String(wc.eval('LASER_STROKE')) && !lz.querySelector('[id="02_SCORE_BLUE"]').hasAttribute('stroke-dasharray'), 'Laser SVG: hairline strokes (LASER_STROKE), continuous score');
  }

  // ---------------- v4 · B three tabs + piece editor · F picture-led help ----------------
  if (wc.document.getElementById('tab-make')) {
    const d = wc.document, $ = id => d.getElementById(id);
    const tabs = ['make', 'print', 'help'].map(t => $('btn-tab-' + t));
    const tabOk = tabs.every(b => b && b.querySelector('img[data-img]') && b.querySelector('img').getAttribute('src')?.startsWith('data:image') && /[؀-ۿ]/.test(b.textContent) && /[A-Z]{3,}/.test(b.textContent));
    log(tabOk && d.querySelectorAll('.v4-tab-btn').length === 3, 'Three tabs with T1 / T6 / T7 icons and EN | AR labels', tabs.map(b => b && b.querySelector('img')?.dataset.img).join(' '));
    wc.switchMainTab('print'); const p1 = !$('tab-print').classList.contains('hidden') && $('tab-make').classList.contains('hidden');
    wc.switchMainTab('help'); const p2 = !$('tab-help').classList.contains('hidden');
    wc.switchMainTab('make'); const p3 = !$('tab-make').classList.contains('hidden');
    log(p1 && p2 && p3, 'Tab switching: MAKE → PRINT & BUILD → HELP');
    // every step A–E: a picture + one EN line + one AR line
    const stepProbs = ['A', 'B', 'C', 'D', 'E'].filter(L => {
      const s = $('step-' + L), figs = [...s.querySelectorAll('figure')];
      return !s.querySelector('.v4-step-head img[src^="data:image"]') || (L !== 'E' && !figs.length) || figs.some(f => !f.querySelector('img[src^="data:image"]') || !f.querySelector('.bi-en') || !/[؀-ۿ]/.test(f.querySelector('.bi-ar')?.textContent || ''));
    });
    log(stepProbs.length === 0, 'Steps A–E: icon + picture(s) with one EN line + one AR line', stepProbs.join(', '));
    const blank = [...d.querySelectorAll('img[data-img]')].filter(im => !(im.getAttribute('src') || '').startsWith('data:image'));
    log(blank.length === 0, 'Every picture is inline (data: URI) — works offline', `${blank.length} without data`);
    // pieces list + editor
    const A = wc.eval('archetypes');
    const before = wc.eval('pieces.length');
    wc.addPiece(); wc.selectArchetype('bed'); wc.setPieceMethod('fold'); wc.setPieceQty(2);
    wc.savePiece(); wc.refreshV4();
    const ps = wc.eval('pieces'), last = ps[ps.length - 1];
    log(ps.length === before + 1 && last.archetype === 'bed' && last.qty === 2 && last.w === A.bed.w && $('piece-editor').classList.contains('hidden'), 'Piece editor: add → type → quantity → save', `${ps.length} pieces, last ${last.archetype} ×${last.qty}`);
    log(/fits on \d+ A[34] sheet/.test($('pieces-sheet-count').textContent), 'Pieces list shows "fits on N sheets"', $('pieces-sheet-count').textContent);
    wc.editPiece(ps.length - 1); wc.setPieceMethod('waffle'); wc.refreshV4();
    const wfOk = !$('ed-waffle').classList.contains('hidden') && /X-ribs \d+ · Y-ribs \d+/.test($('wf-counts').textContent) && $('wf-iso').innerHTML.length > 100;
    log(wfOk, 'Waffle panel: live rib count, sheet count, validation, isometric preview', $('wf-counts').textContent);
    wc.setPieceMethod('fold'); wc.savePiece();
    // build strips only for the methods used
    wc.switchMainTab('print');
    const keys = [...$('build-strips').querySelectorAll('img')].map(i => i.dataset.img).join(' ');
    log(keys === 'H07 H08 H09 H10 H12', 'Build strips: fold-only pieces → H07 H08 H09 H10 H12 only', keys);
    log(/Sheet 1 of \d+/.test($('sheet-pager').textContent) && $('sheet-view').querySelector('svg [id="01_CUT_RED"]'), 'Sheets tab: page 1 of N with the nested sheet', $('sheet-pager').textContent);
    wc.switchMainTab('make');
    // Help Code carries every piece; restoring it rebuilds the list
    wc.document.getElementById('inp-student-name').value = 'Help Code'; wc.document.getElementById('inp-student-id').value = '42'; wc.updateStudentMeta();
    let code = ''; const ex = d.execCommand.bind(d); d.execCommand = c => { if (c === 'copy') code = [...d.querySelectorAll('body > textarea')].pop()?.value || ''; return true; };
    wc.copyStudentDiagnosticCode(); d.execCommand = ex;
    const saved = JSON.stringify(wc.eval('pieces').map(p => [p.archetype, p.method, p.qty, p.w]));
    wc.eval('pieces.length = 1'); wc.refreshV4();
    $('inp-restore-code').value = code; wc.loadStudentDiagnosticCode(); wc.closeValidationModal && wc.closeValidationModal();
    const back = JSON.stringify(wc.eval('pieces').map(p => [p.archetype, p.method, p.qty, p.w]));
    log(saved === back, 'Help Code restores the full pieces list', `${saved.length > 80 ? saved.slice(0, 80) + '…' : saved}`);
    // TA verifies a NESTED sheet's stamp from the Help Code
    wc.refreshV4(); const nest = wc.eval('v4Nest'); const target = nest.sheets[nest.sheets.length - 1];
    wc.openShareSupportModal(); $('vf-help').value = code; wc.verifyFillFromHelp(); $('vf-stamp').value = target.stamp;
    log(wc.verifySheet() === true && /sheet \d+ of \d+|MATCH/.test($('vf-result').textContent), 'Verify box: nested sheet stamp → ✔ (from the Help Code)', $('vf-result').textContent);
    $('vf-scale').value = String(+$('vf-scale').value + 5);
    log(wc.verifySheet() === false, 'Verify box: nested sheet with an edited scale → ✘');
    wc.closeShareSupportModal();
    // handout: 3 pages, 2 × 3 panels, EN + AR under every picture, do / don't row on page 3
    wc.renderHandout();
    const pages = [...$('handout-pages').querySelectorAll('.handout-page')];
    const counts = pages.map(p => p.querySelectorAll('.handout-grid > figure').length).join('/');
    const capsOk = pages.every(p => [...p.querySelectorAll('.handout-grid > figure')].every(f => f.querySelector('img[src^="data:image"]') && f.querySelector('.bi-en') && /[؀-ۿ]/.test(f.querySelector('.bi-ar').textContent)));
    log(pages.length === 3 && counts === '6/6/4' && capsOk && pages[2].querySelectorAll('.handout-dodont > div').length === 6, 'Handout: 3 pages · 6/6/4 panels (H01–H16) + 6 do/don\'t · EN + AR under every picture', counts);
    log(d.querySelector('#ai-prompt-a') && d.querySelector('#ai-prompt-b') && /Neufert/i.test($('step-G').textContent), 'Help · G keeps the Neufert table and Prompt A / B copy buttons');
    log(!$('share-support-modal').open && $('share-support-modal').tagName === 'DETAILS', 'Instructor section collapsed by default');
    // credits: English only (Arabic credit line removed 20 Oct), and no empty row where it was
    const team = wc.eval('COURSE_TEAM'), arEls = [...d.querySelectorAll('.team-credit-ar')];
    $('share-support-modal').open = true;
    const arHidden = arEls.every(e => e.textContent === '' && wc.getComputedStyle(e).display === 'none');
    $('share-support-modal').open = false;
    const enShown = [...d.querySelectorAll('.team-credit-en')].every(e => /Reham Ahmed Abdelwahab/.test(e.textContent));
    const footers = pages.map(p => p.querySelector('footer').textContent).join(' ');
    log(wc.eval('teamLineAr()') === '' && team.instructorAr === '' && team.tasAr.length === 0 && arHidden && enShown && /Reham Ahmed Abdelwahab/.test(footers) && !/[؀-ۿ]/.test(footers),
      'Credits: English everywhere, no Arabic credit line and no empty row', `${arEls.length} Arabic credit slot(s) hidden`);
    log(wc.eval("biGet('H16')").ar.includes('فريق التدريس') && wc.eval("biGet('I1')").ar.startsWith('للمدرّس'), 'Captions H16 / I1 use the revised Arabic wording');
    const size = (await (await fetch(CAND.split('?')[0], { cache: 'no-store' })).blob()).size;
    let alone = ''; wc.__standaloneProbe = h => { alone = h; }; wc.downloadStandaloneHTMLTool(); delete wc.__standaloneProbe;
    const aSize = new Blob([alone]).size;
    log(size < 4 * 1024 * 1024 && aSize > 0 && aSize < 4 * 1024 * 1024, 'Single file and the shared standalone copy both under 4 MB (pictures inline)', `file ${(size / 1048576).toFixed(2)} MB · standalone ${(aSize / 1048576).toFixed(2)} MB`);
    const sd = new DOMParser().parseFromString(alone, 'text/html');
    log(!sd.getElementById('share-support-modal').open && ![...sd.querySelectorAll('img[data-img]')].some(i => i.hasAttribute('src')) && sd.getElementById('tab-make'), 'Standalone copy: instructor section closed, no duplicate pictures');
  }

  log(wc.__errors.length === 0, 'No console errors after all checks', wc.__errors.join(' | '));
  window.REGRESS ={ pass: results.every(r => r.ok), results };
  out.insertAdjacentHTML('beforeend', `\n\n<b>${window.REGRESS.pass ? 'ALL PASS' : 'FAILURES'}</b> (${results.filter(r => r.ok).length}/${results.length})`);
})().catch(e => { log(false, 'Harness crashed', e.stack); window.REGRESS = { pass: false, results }; });
</script>
